name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Fix project structure
        run: |
          PKG=$(grep -m1 '^package' MainActivity.kt | awk '{print $2}')
          [ -z "$PKG" ] && PKG=com.example.app
          DIR=app/src/main/java/${PKG//./\/}
          mkdir -p $DIR app/src/main/res/values app/src/main/res/drawable

          mv *.kt $DIR/ || true
          mv AndroidManifest.xml app/src/main/ || true
          mv colors.xml strings.xml app/src/main/res/values/ || true
          mv ic_*.xml app/src/main/res/drawable/ || true

          # app module build.gradle
          if [ -f app-build.gradle ]; then
            mv app-build.gradle app/build.gradle
          elif grep -q "com.android.application" build.gradle; then
            mv build.gradle app/build.gradle
          fi

          # root build.gradle
          if [ ! -f build.gradle ]; then
            cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF
          fi

          # settings.gradle
          if ! grep -q "include" settings.gradle 2>/dev/null; then
            cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "MyApp"
          include ':app'
          EOF
          fi

          grep -q "android.useAndroidX" gradle.properties || echo "android.useAndroidX=true" >> gradle.properties
          echo "---- structure ----"
          find . -path ./.git -prune -o -type f -print | head -50

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
